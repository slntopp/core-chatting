syntax = "proto3";
package cc;

import "google/protobuf/struct.proto";

option go_package = "github.com/slntopp/core-chatting/cc";

message Empty {}

enum Role {
  NOACCESS = 0;
  USER = 1;
  OWNER = 2;
  ADMIN = 3;
}

message ChatMeta {
  int32 unread = 1;
  Message first_message = 2;
  Message last_message = 3;
  map<string, google.protobuf.Value> data = 4;
}

enum Status {
  NEW = 0;
  OPEN = 1;
  RESOLVE = 2;
  CLOSE = 3;
  ANSWERED = 4;
  CUSTOMER_REPLY = 5;
  WAITING_FOR_REPLY = 6;
  ON_HOLD = 7;
  IN_PROGRESS = 8;
  // ONBOARDING is an outreach ticket: we wrote first, nobody asked. It is the
  // one status a message does not change (see MessagesAPI.Send), so a campaign
  // of thousands does not walk through the operators' status board on its way
  // to being closed. Set only at creation, and only deliberately; it leaves
  // the ticket the way any other does, by someone closing it.
  ONBOARDING = 9;
}

message Chat {
  string uuid = 1;

  repeated string users = 2;
  repeated string admins = 3;
  string owner = 4;

  repeated string gateways = 5;

  Role role = 6;

  optional string topic = 7;
  optional ChatMeta meta = 8;

  int64 created = 9;

  Status status = 10;

  string department = 11;
  optional string responsible = 12;
  map<string, google.protobuf.Value> bot_state = 13;
}

message Chats {
  repeated Chat chats = 1;
}

message Merge {
  repeated string chats = 1;
}

message ListChatsRequest{
  optional uint64 page = 1;
  optional uint64 limit = 2;
  optional string field = 3; // Sort field
  optional string sort = 4;  // Sort direction
  map<string, google.protobuf.Value> filters = 5;
}

message SetBotStateRequest{
  string chat = 1;
  map<string, google.protobuf.Value> state = 2;
  optional bool disabled = 3;
  optional bool escalated = 4;
  optional bool skip_review = 5;
}

message ListChatsResponse{
  repeated Chat pool = 1;
  int64 total = 2;
}

message CountChatsRequest{
  map<string, google.protobuf.Value> filters = 1;
}
message CountChatsResponse{
  map<int32, int64> statuses = 1;
}

service ChatsAPI {
  rpc Create(Chat) returns (Chat);
  rpc Update(Chat) returns (Chat);

  rpc Get(Chat) returns (Chat);
  rpc List(ListChatsRequest) returns (ListChatsResponse);
  rpc Count(CountChatsRequest) returns (CountChatsResponse);

  rpc Delete(Chat) returns (Chat);

  rpc SetBotState(SetBotStateRequest) returns (Chat);
  rpc GetBotState(Chat) returns (Chat);

  rpc ChangeDepartment(Chat) returns (Chat);
  rpc ChangeGateway(Chat) returns (Chat);
  rpc ChangeStatus(Chat) returns (Chat);

  rpc MergeChats(Merge) returns (Chat);
  rpc SyncChats(Empty) returns (Empty);
}

enum Kind {
  DEFAULT = 0;
  // ADMIN_ONLY is a note humans leave for each other about the chat. The
  // customer never sees it; nothing answers it.
  ADMIN_ONLY = 1;
  FOR_BOT = 2;
  // COPILOT is the operator's conversation WITH the AI assistant about this
  // chat. Same visibility as ADMIN_ONLY - admins only - but a separate lane,
  // because the two were one and the notes operators wrote to each other kept
  // waking the bot, while the bot's answers filled the notes.
  COPILOT = 3;
}

message Attachment {
  string type = 1;
  bytes content = 2;
}

// PollOption is one answer to pick.
//
// The id is what a vote refers to, never the label or the position: editing
// the wording of an option afterwards must not silently move everybody who
// already answered onto a different answer.
message PollOption {
  string id = 1;
  string label = 2;
}

// PollVote is one person's answer.
message PollVote {
  repeated string options = 1; // option ids
  int64 ts = 2;
}

// Poll turns a message into a question with answers to click, instead of a
// list of options typed into the text and an answer typed back.
//
// It is a field of an ordinary message, not a kind of its own: everything that
// already carries a message — the event stream, the gateways, the WHMCS sync,
// read receipts — carries a poll without knowing anything about polls. A
// client that has not been taught about them shows the question and nothing
// else, which is why gateway and WHMCS events get the options appended to
// their text copy (see pkg/pubsub): a person on telegram or email still sees
// what there was to answer and can reply in words.
message Poll {
  // question is optional: usually the message text is the question, and this
  // is left empty.
  string question = 1;
  repeated PollOption options = 2;
  // multiple allows more than one answer at a time.
  bool multiple = 3;
  // closed stops accepting answers. The answers already given stay visible.
  bool closed = 4;
  // votes is keyed by account uuid. A ticket has one customer, so this is
  // normally a single entry — the point is knowing *who* answered *what*, not
  // a tally.
  map<string, PollVote> votes = 5;
}

// VoteRequest answers a poll. An empty options list retracts the answer.
message VoteRequest {
  string message = 1;
  repeated string options = 2; // option ids
}

message Message {
  string uuid = 1;
  Kind kind = 2;

  string sender = 3;
  string content = 4;

  repeated string attachments = 5;
  repeated string gateways = 6;

  optional string chat = 7; // Required for Send, Update and Delete requests

  int64 sent = 8;
  int64 edited = 9;

  bool under_review = 10;
  repeated string readers = 11;
  map<string, google.protobuf.Value> meta = 12;

  repeated string mentioned = 13;

  // poll is set on the few messages that ask something with buttons.
  optional Poll poll = 14;
}
message Messages {
  repeated Message messages = 1;
}

message MessagesListRequest{}

service MessagesAPI {
  rpc Get(Chat) returns (Messages);

  rpc Send(Message) returns (Message);
  rpc Update(Message) returns (Message);

  rpc Delete(Message) returns (Message);

  // Vote answers the poll on a message. Anyone with access to the chat may
  // answer, once — voting again replaces the previous answer.
  rpc Vote(VoteRequest) returns (Message);

  rpc List(MessagesListRequest) returns (Messages);
}

message User {
  string uuid = 1;
  string title = 2;
  google.protobuf.Struct data = 3;

  bool cc_is_bot = 4;
  string cc_username = 5;
  map<string, string> cc_commands = 6;
}

message Department {
  string key = 1;
  string title = 2;
  string description = 3;
  repeated string admins = 4;
  bool public = 5;
  optional string whmcs_id = 6;
}

message Option {
  string key = 1;
  float value = 2;
}

message Metric {
  string title = 1;
  repeated Option options = 2;
}

message Defaults {
  repeated string gateways = 1;
  repeated string admins = 2;
  repeated Department departments = 3;
  map<string, Metric> metrics = 4;
  map<string, string> templates = 5;
  Bot bot = 6;
}

message Bot {
  string prompt = 1;               // Bot's prompt.
  bool review = 2;                 // If bot's messages always under review.
  bool enable = 3;                 // If bot enabled or disabled in new chats.
  map<string, string> values = 4;  // Custom key-value variables for bot's prompt (prompt field). Use it like this in prompt - {VALUE_KEY}
  bool initiator = 5;              // If bot's FIRST message ignoring 'review' state. That means bot ALWAYS sends his first message no matter what.
  bool emergency = 6;              // True - If some emergency situation happens. Bot should check this state and base his response on this field.
}

message Users {
  repeated User users = 1;
  int64 total = 2;
}

message FetchDefaultsRequest {
  bool fetch_templates = 1;
}

message GetMembersRequest{
  repeated string uuids = 1;
  optional uint64 page = 2;
  optional uint64 limit = 3;
  optional string field = 4; // Sort field
  optional string sort = 5;  // Sort direction
  map<string, google.protobuf.Value> filters = 6;
}

service UsersAPI {
  rpc Me(Empty) returns (User);
  rpc FetchDefaults(FetchDefaultsRequest) returns (Defaults);

  rpc GetConfig(Empty) returns (Defaults);
  rpc SetConfig(Defaults) returns (Defaults);

  // Resolves given Users data by their UUIDs
  // And returns all accessible Users for Requestor
  rpc Resolve(Users) returns (Users);
  rpc GetMembers(GetMembersRequest) returns (Users);
}

enum EventType {
  PING = 0;
  CHAT_CREATED = 1;
  CHAT_UPDATED = 2;
  CHAT_DELETED = 3;
  CHAT_READ = 4;
  MESSAGE_SENT = 5;
  MESSAGE_UPDATED = 6;
  MESSAGE_DELETED = 7;
  CHAT_DEPARTMENT_CHANGED = 8;
  CHAT_STATUS_CHANGED = 9;
  CHATS_MERGED = 10;
}

message Event {
  EventType type = 1;
  oneof item {
    Chat chat = 2;
    Message msg = 3;
  }
}

message StreamRequest {
  map<string, string> commands = 1;
}

service StreamService {
  rpc Stream(StreamRequest) returns (stream Event);
}
